# Server Configuration
server.port=8080

# Spring Codec
spring.codec.max-in-memory-size=10MB

# Maximum size for a single file
spring.servlet.multipart.max-file-size=15MB

# Maximum size for the entire request (useful if uploading multiple images)
spring.servlet.multipart.max-request-size=15MB

# Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/home_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionTimeZone=UTC&useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# Google Security
spring.application.security.google.client-id=google-client-id

# JWT Security
spring.application.security.jwt.secret-key=${JWT_SECRET_KEY}
# a day
spring.application.security.jwt.expiration=86400000
# 7 days
spring.application.security.jwt.refresh-token.expiration=604800000

# Cloudinary
cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api-key=${CLOUD_API_KEY}
cloudinary.api-Secret=${CLOUD_API_SECRET}

# Gemini API
gemini.api.key=${GEMINI_API_KEY:REPLACE_WITH_YOUR_KEY}
gemini.project.id=${GEMINI_PROJECT_ID:REPLACE_WITH_YOUR_PROJECT_ID}

# Async config
spring.threads.virtual.enabled=true